<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  
  <!-- Aggressive Anti-Caching Meta Tags -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <meta name="description" content="Easy Work Web — AI-powered job matching platform & Europass CV builder for global workers moving to Europe.">
  <meta name="keywords" content="Easy Work, EU Jobs, Europe Careers, Europass CV, Visa Sponsorship Jobs, Work in Europe">
  <meta name="author" content="Easy Work Platform Team">

  <!-- Monetag Verification Removed to prevent Popunders -->

  <!-- Force Cache Busting & Service Worker Unregistration -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) {
            caches.delete(name);
          }
        });
      }
    }
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Easy Work Web">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Easy Work Web — European Jobs & Relocation Platform</title>
  <link rel="manifest" href="manifest.json">


  <!-- Standard Flutter Web Engine Bootstrap -->
  <script src="flutter_bootstrap.js" async></script>
</head>
<body style="background-color: #0D1117; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif; color: #FFFFFF;">
  <!-- Styled Loading Indicator (Removed automatically when Flutter renders) -->
  <div id="loading-indicator" style="text-align: center;">
    <div style="width: 48px; height: 48px; border: 4px solid #1F6FEB; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px auto;"></div>
    <div style="font-size: 15px; font-weight: 600; color: #58A6FF; letter-spacing: 0.5px;">Easy Work Web</div>
    <div style="font-size: 12px; color: #8B949E; margin-top: 6px;">جاري تحميل المنصة...</div>
  </div>
  <style>
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(0.95); } }
    @keyframes orbFloat1 { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(40px, -30px); } }
    @keyframes orbFloat2 { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(-30px, 20px); } }
    @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    #loading-indicator { position: relative; z-index: 10; animation: fadeSlideUp 0.6s ease-out; }
    .load-orb1 { position: fixed; top: -100px; left: -100px; width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(0,127,255,0.15) 0%, transparent 70%);
      border-radius: 50%; animation: orbFloat1 8s ease-in-out infinite; pointer-events: none; }
    .load-orb2 { position: fixed; bottom: -80px; right: -80px; width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(16,185,129,0.1) 0%, transparent 70%);
      border-radius: 50%; animation: orbFloat2 10s ease-in-out infinite; pointer-events: none; }
    .logo-ring { width: 72px; height: 72px; border: 2.5px solid rgba(0,127,255,0.4);
      border-top-color: #007FFF; border-radius: 50%; animation: spin 1.2s linear infinite; margin: 0 auto 20px auto; 
      box-shadow: 0 0 20px rgba(0,127,255,0.3); }
    .logo-ring::after { content: ''; display: block; width: 56px; height: 56px;
      border: 2px solid rgba(16,185,129,0.3); border-bottom-color: #10B981;
      border-radius: 50%; margin: 5px auto; animation: spin 1.8s linear infinite reverse; }
    .brand-name { font-size: 20px; font-weight: 700; letter-spacing: -0.3px;
      background: linear-gradient(90deg, #60A5FA, #007FFF, #10B981, #60A5FA);
      background-size: 300% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; animation: shimmer 3s linear infinite; margin-bottom: 8px; }
    .brand-sub { font-size: 12px; color: #8B949E; animation: pulse 2s ease-in-out infinite; }
    .dot-trail { display: flex; gap: 6px; justify-content: center; margin-top: 16px; }
    .dot-trail span { width: 6px; height: 6px; border-radius: 50%; background: #007FFF; 
      animation: pulse 1.4s ease-in-out infinite; }
    .dot-trail span:nth-child(2) { animation-delay: 0.2s; background: #3399FF; }
    .dot-trail span:nth-child(3) { animation-delay: 0.4s; background: #10B981; }
  </style>
  <!-- Non-blocking deferred ad scriptloader -->
  <script>
    window.addEventListener('load', function() {
      setTimeout(function() {
        // Google AdSense Script
        var s2 = document.createElement('script');
        s2.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5642739957710217";
        s2.setAttribute('crossorigin', 'anonymous');
        s2.async = true;
        document.head.appendChild(s2);

        // Travelpayouts Script
        var s3 = document.createElement('script');
        s3.src = "https://tp.media/content?currency=eur&promo_id=4054&shmarker=123456&campaign_id=100&trs=28822";
        s3.setAttribute('charset', 'utf-8');
        s3.async = true;
        document.head.appendChild(s3);
      }, 1500);
    });
  </script>
</body>
</html>
