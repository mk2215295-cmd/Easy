<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  
  <!-- Aggressive Anti-Caching Meta Tags -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <meta name="description" content="Easy Work Web — AI-powered job matching platform & Europass CV builder for global workers moving to Europe.">
  <meta name="keywords" content="Easy Work, EU Jobs, Europe Careers, Europass CV, Visa Sponsorship Jobs, Work in Europe">
  <meta name="author" content="Easy Work Platform Team">

  <!-- Force Cache Busting & Service Worker Unregistration -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) {
            caches.delete(name);
          }
        });
      }
    }
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Easy Work Web">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Easy Work Global — European & Global Careers</title>
  <link rel="manifest" href="manifest.json">

  <!-- Standard Flutter Web Engine Bootstrap -->
  <script src="flutter_bootstrap.js" async></script>
</head>
<body style="background-color: #030712; margin: 0; padding: 0; min-height: 100vh; overflow: hidden;">
</body>
</html>
